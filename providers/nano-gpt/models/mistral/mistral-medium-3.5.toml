# Not included in subscription
base_model = "mistral/mistral-medium-2604"

description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[cost]
input = 1.5
output = 7.5
cache_read = 0.75

[limit]
context = 256_000
input = 256_000
output = 32_768
